name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package, Laravel and PHP versions
      placeholder: form-shield 1.0.0, Laravel 13.2, PHP 8.4
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: verdict
    attributes:
      label: The verdict
      description: "`$verdict->toArray()` for the submission, if relevant. Remove personal data."
      render: php
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A failing test is ideal.
